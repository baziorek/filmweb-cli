name: main-ci

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYINSTALLER_VERSION: "6.22.3"
  PYREFLY_VERSION: "0.49.0"
  RUFF_VERSION: "0.14.8"
  TAPLO_VERSION: "0.9.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
      - run: |
          pip install --no-cache-dir ruff==${{ env.RUFF_VERSION }} pyrefly==${{ env.PYREFLY_VERSION }}
          pip install -r ./requirements/typing.txt -r ./requirements/base.txt
          ruff check .
          pyrefly check .

  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/download/${{ env.TAPLO_VERSION }}/taplo-linux-x86_64.gz | gunzip -c - | install -m 755 /dev/stdin /usr/local/bin/taplo
      - name: Run Taplo
        run: taplo format --check --diff

  build:
    runs-on: ubuntu-latest
    needs: [lint, taplo]
    container:
      image: python:3.12-alpine
    steps:
      - uses: actions/checkout@v7
      - run: |
          pip install --no-cache-dir build
          python -m build --sdist --wheel --outdir dist

      - name: Upload dist artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Standalone one-file executables (Python and all dependencies bundled), built on every run.
  # Download them from the "Artifacts" section of a workflow run; tagged builds also attach them to the release.
  binaries:
    name: binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest available Ubuntu LTS runner, so the binary runs on older glibc versions too.
          - { name: linux-x86_64, os: ubuntu-22.04, ext: "" }
          - { name: windows-x86_64, os: windows-latest, ext: ".exe" }
          - { name: macos-arm64, os: macos-latest, ext: "" }
          - { name: macos-x86_64, os: macos-15-intel, ext: "" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements/base.txt pyinstaller==${{ env.PYINSTALLER_VERSION }}

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name filmweb
          --paths src
          --collect-submodules filmweb_cli
          src/filmweb_cli/__main__.py

      - name: Smoke test
        run: ./dist/filmweb${{ matrix.ext }} --help

      - name: Rename executable
        run: mv dist/filmweb${{ matrix.ext }} dist/filmweb-${{ matrix.name }}${{ matrix.ext }}

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: filmweb-${{ matrix.name }}
          path: dist/filmweb-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
      runs-on: ubuntu-latest
      needs: [build, binaries]
      if: startsWith(github.ref, 'refs/tags/v')
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v7

        - name: Verify version and extract release notes
          run: |
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PYPROJECT_VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version\s*=\s*"(.*)"/\1/')

            [ "$TAG_VERSION" = "$PYPROJECT_VERSION" ] || { echo "::error::Tag ($TAG_VERSION) != pyproject.toml ($PYPROJECT_VERSION)"; exit 1; }
            grep -qE "^## \[${TAG_VERSION}\]" CHANGELOG.md || { echo "::error::No CHANGELOG.md section for $TAG_VERSION"; exit 1; }

            awk -v ver="$TAG_VERSION" '
              /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") { found=1; next } }
              found { print }
            ' CHANGELOG.md > release_notes.md

        - name: Download dist artifact
          uses: actions/download-artifact@v8
          with:
            name: dist
            path: dist

        - name: Download executables
          uses: actions/download-artifact@v8
          with:
            pattern: filmweb-*
            merge-multiple: true
            path: bin

        - name: Generate checksums
          working-directory: bin
          run: sha256sum filmweb-* > SHA256SUMS.txt

        - name: Create GitHub Release
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release_notes.md \
              dist/* bin/*
